server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aynalytics : /_ay/* est relayé au collector (conteneur aynalytics-collector sur le
    # réseau Docker partagé « pangolin »). Le navigateur ne voit que bonap.app.
    # `^~` : prioritaire sur la regex des assets ci-dessous (sinon /_ay/sdk.js y tomberait).
    location ^~ /_ay/ {
        # Résolution DNS Docker à la requête : nginx démarre même si le collector est
        # arrêté ; /_ay/ répond alors 502 sans casser le site.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $aynalytics http://aynalytics-collector:8080;
        rewrite ^/_ay/(.*)$ /$1 break;
        proxy_pass $aynalytics;

        # IP réelle du visiteur (géolocalisation, rate limit) pour le collector.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        client_max_body_size 64k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Assets fingerprintés par Vite : cache long
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback : toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
